name: Feature request
description: Propose a new capability or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For anything bigger than a small ergonomics tweak, please
        describe the **problem** first. "I want a flag that does X"
        is harder to evaluate than "When I do Y, the protocol forces
        me into Z; here's why that hurts."

        Wire-format changes are governed by the protocol
        specification at
        [oscarvalenzuelab/DNSMeshProtocol](https://github.com/oscarvalenzuelab/DNSMeshProtocol).
        File a spec issue there first; the Rust port follows the
        spec, it doesn't drive it.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what's blocking you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Concrete shape of the change. CLI flag / SDK API surface / config field / new module — whatever applies.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried. Approaches you ruled out and why.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - SDK API (library surface — `dnsmesh-client` / `-core` / `-net`)
        - CLI ergonomics (`dnsmesh` subcommand or flag)
        - MUA integration (mutt / Maildir / sendmail-compat)
        - Mobile FFI surface (`dnsmesh-ffi`)
        - Storage / on-disk schema
        - Tooling / CI / release pipeline
        - Documentation
        - Spec change (file at DNSMeshProtocol instead)
    validations:
      required: true
