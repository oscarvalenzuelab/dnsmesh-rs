name: Mobile

# Fires on `mobile-v*` tags. Builds the iOS xcframework and Android aar from
# `dnsmesh-ffi` and uploads them to the GH Release. Bindings are generated by
# UniFFI in `--library` mode so we don't need a `.udl` file (the FFI crate uses
# proc-macro mode — see crates/dnsmesh-ffi/src/lib.rs).
on:
  push:
    tags:
      - "mobile-v*"

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Extract version
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$tag" =~ ^mobile-v([0-9]+\.[0-9]+\.[0-9]+([-+].+)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "::error::tag '$tag' does not match mobile-v<semver>"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Confirm workspace.version matches tag
        shell: bash
        run: |
          set -euo pipefail
          ws_version="$(cargo metadata --no-deps --format-version=1 \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="dnsmesh-ffi"))')"
          tag_version="${{ steps.extract.outputs.version }}"
          if [[ "$ws_version" != "$tag_version" ]]; then
            echo "::error::tag version $tag_version does not match workspace.version $ws_version"
            exit 1
          fi

  ios:
    name: iOS xcframework
    needs: validate
    runs-on: macos-14
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      # Boolean presence flag only — keeps the actual signing secret out of
      # job-level env, so unrelated third-party actions on this runner never
      # see APPLE_DEVELOPER_ID_CERT_NAME. The signing step maps the secret
      # in via its own step-level env.
      HAS_APPLE_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT_NAME != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (with iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-xcframework

      # UniFFI 0.28+ no longer ships an installable `uniffi-bindgen`
      # crate; we build our own thin wrapper from `dnsmesh-ffi` that
      # calls `uniffi::uniffi_bindgen_main()` under the `cli` feature.
      - name: Build embedded uniffi-bindgen
        run: cargo build -p dnsmesh-ffi --features cli --bin uniffi-bindgen

      - name: Build iOS device slice (aarch64-apple-ios)
        run: cargo build -p dnsmesh-ffi --release --target aarch64-apple-ios

      - name: Build iOS simulator slices (arm64 + x86_64)
        run: |
          cargo build -p dnsmesh-ffi --release --target aarch64-apple-ios-sim
          cargo build -p dnsmesh-ffi --release --target x86_64-apple-ios

      # Generate Swift bindings from the device-slice dylib. UniFFI 0.28 supports
      # `--library` mode which inspects the compiled artifact instead of a .udl.
      - name: Generate Swift bindings
        run: |
          mkdir -p bindings/swift
          ./target/debug/uniffi-bindgen generate \
            --library target/aarch64-apple-ios/release/libdnsmesh_ffi.dylib \
            --language swift \
            --out-dir bindings/swift

      # Combine the two simulator static archives into a single fat archive so
      # the xcframework has one slice per platform (device, simulator).
      - name: Lipo simulator static lib
        run: |
          mkdir -p target/universal-ios-sim/release
          lipo -create \
            target/aarch64-apple-ios-sim/release/libdnsmesh_ffi.a \
            target/x86_64-apple-ios/release/libdnsmesh_ffi.a \
            -output target/universal-ios-sim/release/libdnsmesh_ffi.a

      # UniFFI emits `dnsmesh_ffiFFI.h` and a modulemap alongside the .swift —
      # xcodebuild needs both in a Headers directory next to the static lib.
      # Hard-fail if either is missing: a successful xcframework with empty
      # headers compiles fine here but blows up later when an iOS consumer
      # tries to import it. Earlier we silently swallowed the cp errors,
      # which let those broken frameworks ship.
      - name: Stage headers for xcframework
        run: |
          set -euo pipefail
          mkdir -p headers
          shopt -s nullglob
          headers=( bindings/swift/*.h )
          modulemaps=( bindings/swift/*.modulemap )
          if (( ${#headers[@]} == 0 )); then
            echo "::error::no UniFFI .h headers in bindings/swift/ — uniffi-bindgen likely failed silently"
            ls -la bindings/swift/ || true
            exit 1
          fi
          if (( ${#modulemaps[@]} == 0 )); then
            echo "::error::no UniFFI .modulemap in bindings/swift/ — uniffi-bindgen likely failed silently"
            ls -la bindings/swift/ || true
            exit 1
          fi
          cp "${headers[@]}" "${modulemaps[@]}" headers/
          ls -la headers/ bindings/swift/

      - name: Assemble DnsMesh.xcframework
        run: |
          rm -rf DnsMesh.xcframework
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libdnsmesh_ffi.a \
            -headers headers \
            -library target/universal-ios-sim/release/libdnsmesh_ffi.a \
            -headers headers \
            -output DnsMesh.xcframework

      - name: Code-sign xcframework
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_DEVELOPER_ID_CERT_NAME: ${{ secrets.APPLE_DEVELOPER_ID_CERT_NAME }}
        run: |
          codesign --sign "$APPLE_DEVELOPER_ID_CERT_NAME" --timestamp DnsMesh.xcframework

      - name: Skip xcframework signing (no cert configured)
        if: env.HAS_APPLE_CERT != 'true'
        run: echo "APPLE_DEVELOPER_ID_CERT_NAME unset — shipping unsigned xcframework (see CONTRIBUTING.md)."

      - name: Zip xcframework + bindings
        run: |
          set -euo pipefail
          stage="DnsMesh-${VERSION}-ios"
          mkdir -p "dist/$stage"
          cp -R DnsMesh.xcframework "dist/$stage/"
          cp -R bindings/swift "dist/$stage/swift-bindings"
          cp LICENSE README.md "dist/$stage/"
          (cd dist && zip -ry "${stage}.zip" "$stage")
          ls -la dist/

      - name: Upload to GH Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*.zip

  # Android path is intentionally minimal for M6 — see CONTRIBUTING.md and the
  # M6 plan note: "prefer correctness over completeness". This builds the four
  # Android ABI slices and packages them as a hand-rolled .aar (just a zip with
  # a specific layout), which is enough for SDK consumers to drop into a
  # project. Future work: gradle-published Maven coordinates, R8/desugaring,
  # consumer-rules.pro.
  android:
    name: Android aar
    needs: validate
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (with Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: android-aar

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk --version ^3

      - name: Build embedded uniffi-bindgen
        run: cargo build -p dnsmesh-ffi --features cli --bin uniffi-bindgen

      - name: Build all Android ABIs (API 24)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 \
            -p 24 \
            -o jniLibs \
            build -p dnsmesh-ffi --release

      - name: Generate Kotlin bindings
        run: |
          mkdir -p bindings/kotlin
          ./target/debug/uniffi-bindgen generate \
            --library target/aarch64-linux-android/release/libdnsmesh_ffi.so \
            --language kotlin \
            --out-dir bindings/kotlin

      # Hand-roll a minimal .aar. AAR is a zip with this layout:
      #   AndroidManifest.xml     (required, even if empty-ish)
      #   classes.jar             (required; we ship an empty jar — Kotlin
      #                            sources go in a separate sources jar that
      #                            consumers compile themselves, or we ship
      #                            them under `kotlin/` for tooling pickup)
      #   jni/<abi>/lib*.so       (per-ABI shared libs)
      #   R.txt                   (empty)
      # See: https://developer.android.com/studio/projects/android-library#aar-contents
      - name: Assemble dnsmesh-ffi.aar
        run: bash crates/dnsmesh-ffi/scripts/build-aar.sh "$VERSION"

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          stage="dnsmesh-android-${VERSION}"
          mkdir -p "dist/$stage"
          cp "dist/dnsmesh-ffi-${VERSION}.aar" "dist/$stage/"
          cp -R bindings/kotlin "dist/$stage/kotlin-bindings"
          cp LICENSE README.md "dist/$stage/"
          (cd dist && zip -ry "${stage}.zip" "$stage")
          ls -la dist/

      - name: Upload to GH Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/dnsmesh-ffi-*.aar
            dist/dnsmesh-android-*.zip
