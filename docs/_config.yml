title: dnsmesh-rs
description: >-
  Rust SDK and CLI for the DNS Mesh Protocol — end-to-end encrypted
  messaging delivered over DNS, with a sendmail-compatible MUA bridge
  for mutt/neomutt and an FFI surface for iOS / Android consumers.

# Pretty URLs that work both under GitHub Pages (served at
# /dnsmesh-rs/) and when previewing locally with `bundle exec
# jekyll serve`.
baseurl: /dnsmesh-rs
url: "https://oscarvalenzuelab.github.io"

# Use Just the Docs as a remote theme so GitHub Pages builds it for
# us without having to vendor the theme files.
remote_theme: just-the-docs/just-the-docs

color_scheme: dark

# Sidebar / search configuration.
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  rel_url: true
  button: false

# Top-right aux link — always visible in the header.
aux_links:
  "GitHub":
    - "https://github.com/oscarvalenzuelab/dnsmesh-rs"
  "Protocol spec":
    - "https://github.com/oscarvalenzuelab/DNSMeshProtocol"
aux_links_new_tab: true

# Show "Edit this page on GitHub" links.
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/oscarvalenzuelab/dnsmesh-rs"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

# Enable callouts (the `{: .note }` syntax Just the Docs ships with).
callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

# Skip these files so Jekyll doesn't try to render tooling-only things.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - README.md

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
