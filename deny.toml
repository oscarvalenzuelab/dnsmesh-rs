[graph]
all-features = true

[advisories]
yanked = "deny"
# Each ignore documents why the advisory is suppressed and what the
# path forward looks like. Refresh when upstream cuts a real fix.
ignore = [
    # Hickory NSEC3 closest-encloser proof — unbounded loop on
    # cross-zone responses. As of advisory date (2026-05-01) no
    # fixed version is published; the upstream PR is in flight
    # against 0.26. dnsmesh-rs queries TXT records over UDP/TCP,
    # not DNSSEC-validated zones, so the NSEC3 proof path is not
    # on the hot path. Will drop once a stable hickory release
    # with the fix lands on crates.io.
    "RUSTSEC-2026-0118",

    # Hickory O(n^2) name compression on encode. Fix is in
    # 0.26.0-alpha.1 only; no stable >=0.26.1 published as of
    # this writing. Encoding paths run on names we control
    # (identity, slot, prekey RRset names), not attacker-supplied
    # input. Will drop once 0.26.1 stable lands.
    "RUSTSEC-2026-0119",

    # bincode 1.x is unmaintained. Pulled transitively via
    # uniffi_macros; the uniffi maintainers track this in their
    # roadmap. Out of our hands until they cut a release that
    # drops the dep.
    "RUSTSEC-2025-0141",

    # number_prefix is unmaintained. Pulled transitively via
    # indicatif; an open issue tracks the drop. Out of our hands.
    "RUSTSEC-2025-0119",

    # paste is unmaintained. Pulled transitively via uniffi_core /
    # uniffi_macros — same roadmap as bincode above.
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path-deps (`{ path = "../foo" }`) are technically
# wildcards as far as cargo-deny is concerned but are not the real-
# world "no version pin" footgun this rule is here to catch. Allow
# path-style wildcards while keeping `*` version specs blocked.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "allow"
