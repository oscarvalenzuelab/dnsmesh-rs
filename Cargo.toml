[workspace]
resolver = "2"
members = [
    "crates/dnsmesh-core",
    "crates/dnsmesh-net",
    "crates/dnsmesh-storage",
    "crates/dnsmesh-client",
    "crates/dnsmesh-ffi",
    "crates/dnsmesh-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/oscarvalenzuelab/dnsmesh-rs"
authors = ["Oscar Valenzuela <oscar.valenzuela.b@gmail.com>"]
# Distribution channel is GitHub Releases (CLI binaries, FFI artifacts,
# mobile xcframework / aar) — not crates.io. Setting `publish = false`
# here makes that intent explicit and prevents accidental publish.
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# allow some pedantic lints that are noisy on early code
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
