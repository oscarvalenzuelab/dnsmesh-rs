[package]
name = "dnsmesh-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "DMP high-level client API."

[dependencies]
dnsmesh-core = { path = "../dnsmesh-core" }
dnsmesh-net = { path = "../dnsmesh-net" }
dnsmesh-storage = { path = "../dnsmesh-storage" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"
# Already transitive via x25519-dalek; pulled in directly so we can use OsRng
# for generating message IDs and shuffling prekey pools without going through
# heavier helpers.
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"
# Used only by tests/python_interop.rs to (de)serialize the store snapshot
# JSON file the Python helper consumes / produces.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
