[package]
name = "dnsmesh-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "DMP local persistence for keys, sessions, and message state."

[dependencies]
dnsmesh-core = { path = "../dnsmesh-core" }
# SQLCipher rather than plain bundled sqlite: the database holds prekey
# private halves and decrypted intro payloads, so the file itself is keyed.
# `vendored-openssl` builds OpenSSL from source, which keeps cross-compiles
# self-contained — see the Android note in the release workflow.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
# Held at the 3.5 series on purpose. OpenSSL 3.6 emits SM4 AVX instructions
# (vsm4key4, vsm4rnds4) in crypto/sm4/sm4-x86_64.S, and the NDK r26 clang
# assembler does not know them, so the x86_64-linux-android build dies with
# "invalid instruction mnemonic". Nothing here uses SM4; the pin exists
# solely so the Android APK can be built. Revisit when the NDK ships a newer
# assembler, and check the x86_64 Android build before lifting it.
openssl-src = "=300.5.2"
refinery = { version = "0.8", features = ["rusqlite"] }
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
# x25519-dalek is already a transitive dep via dnsmesh-core; pulling it in
# directly here so PrekeyStore::generate_pool can derive public keys
# without round-tripping through DmpCrypto. Same workspace-locked version.
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["std"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
