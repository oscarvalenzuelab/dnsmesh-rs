[package]
name = "dnsmesh-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "DMP local persistence for keys, sessions, and message state."

[dependencies]
dnsmesh-core = { path = "../dnsmesh-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
refinery = { version = "0.8", features = ["rusqlite"] }
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
# x25519-dalek is already a transitive dep via dnsmesh-core; pulling it in
# directly here so PrekeyStore::generate_pool can derive public keys
# without round-tripping through DmpCrypto. Same workspace-locked version.
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["std"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
